name: Build APK (arm64)

# Builds the release APK for android-arm64 and uploads it as a workflow
# artifact named `habitnow-arena-arm64`.
#
# Triggers:
#  - manual dispatch from the Actions tab (any branch with this file)
#  - pushes that touch app code or this workflow (so CI stays honest)
on:
  workflow_dispatch: {}
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/build-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK (android-arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.10 (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Flutter doctor (toolchain visibility)
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (does not fail the build)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitnow-arena-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
