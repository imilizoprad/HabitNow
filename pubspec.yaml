name: habit_now
description: >-
  HabitNow Arena — a serverless, peer-to-peer habit tracker where friends
  connect on the same network, compete in challenges, settle stakes,
  serve forfeits and grow together. No accounts, no backend, no cloud.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Pinned to the stable line this codebase was authored against.
  # Anything >= Flutter 3.38 (Dart 3.10) is expected to work.
  sdk: '>=3.6.0 <4.0.0'

# Deliberately dependency-free (Flutter SDK only).
# True peer-to-peer networking is implemented in pure Dart (dart:io /
# dart:async), persistence uses a tiny purpose-built platform channel, so
# the build has no plugin surface, no version drift and no vendor lock-in.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
